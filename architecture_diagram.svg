<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="430" fill="#ffffff"/>

  <rect x="450" y="150" width="170" height="50" rx="10" fill="#eef0f2" stroke="#5F5E5A" stroke-width="1"/>
  <text x="535" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Nearby BLE devices</text>
  <text x="535" y="187" text-anchor="middle" font-size="11" fill="#5F5E5A">Broadcasting signals</text>

  <path d="M450 175 L430 210" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="250" y="190" width="180" height="70" rx="10" fill="#e0f2ee" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F6E56">ESP32-S3 DevKit</text>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#0F6E56">Scans BLE, runs logic,</text>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#0F6E56">hosts WiFi dashboard</text>

  <rect x="250" y="50" width="180" height="60" rx="10" fill="#e3edf9" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#185FA5">0.96" OLED Display</text>
  <text x="340" y="93" text-anchor="middle" font-size="11" fill="#185FA5">Live status readout</text>

  <line x1="340" y1="190" x2="340" y2="110" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="150" font-size="11" fill="#185FA5">I2C: SDA 8, SCL 9</text>

  <rect x="70" y="330" width="170" height="60" rx="10" fill="#fbf0dd" stroke="#854F0B" stroke-width="1"/>
  <text x="155" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#854F0B">Buzzer</text>
  <text x="155" y="373" text-anchor="middle" font-size="11" fill="#854F0B">Audible alarm</text>

  <path d="M270 260 L155 330" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="300" font-size="11" fill="#854F0B">GPIO4</text>

  <rect x="430" y="330" width="170" height="60" rx="10" fill="#fbe7e2" stroke="#993C1D" stroke-width="1"/>
  <text x="515" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#993C1D">Onboard LED</text>
  <text x="515" y="373" text-anchor="middle" font-size="11" fill="#993C1D">Visual alarm</text>

  <path d="M410 260 L515 330" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="300" font-size="11" fill="#993C1D">LED_BUILTIN</text>

  <rect x="450" y="230" width="170" height="60" rx="10" fill="#e0f2ee" stroke="#0F6E56" stroke-width="1"/>
  <text x="535" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F6E56">Web Dashboard</text>
  <text x="535" y="273" text-anchor="middle" font-size="11" fill="#0F6E56">192.168.4.1 (WiFi AP)</text>

  <line x1="430" y1="235" x2="450" y2="255" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
